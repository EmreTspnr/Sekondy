services:
  # 1. MongoDB Service (Database)
  mongodb:
    image: mongo:latest
    container_name: sekondy-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  # 2. Redis Service (Cache)
  redis:
    image: redis:alpine
    container_name: sekondy-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. RabbitMQ Service (Message Queue)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sekondy-rabbitmq
    ports:
      - "5672:5672" # Message port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  # 4. Node.js REST API Backend
  api:
    build: 
      context: ./rest-api
      dockerfile: Dockerfile
    container_name: sekondy-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/sekondy
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=sekondy_jwt_secret_key_123
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    restart: unless-stopped

  # 5. RabbitMQ Worker Service
  worker:
    build: 
      context: ./rest-api
      dockerfile: Dockerfile
    container_name: sekondy-worker
    command: npm run worker
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/sekondy
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # 5. Expo/React Native is typically run locally during dev, 
  # but if a web-build or mock-service is needed, it goes here.
  # For mobile development, Expo Go runs on your physical device, 
  # connecting to the local IP of the backend API.

volumes:
  mongodb_data:
